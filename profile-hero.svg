    <text x="54" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="63" font-weight="800" letter-spacing="-.9" fill="#F8FAFF">Youssef Elsayed</text>
    <rect x="59" y="183" width="72" height="4" rx="2" fill="url(#beam)"/>
    <text x="58" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#C1B9FF">Software Engineer</text>
    <text x="58" y="263" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#9AAAC6">I turn ideas into products that people can use.</text>
    <text x="58" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.6" fill="#7F91B8">BUILD  /  SHIP  /  IMPROVE</text>

    <circle cx="992" cy="162" r="114" fill="none" stroke="#776AF2" opacity=".18" stroke-width="2"/>
    <circle cx="992" cy="162" r="89" fill="none" stroke="#39CAEA" opacity=".24" stroke-width="1.5" stroke-dasharray="5 10"/>
    <circle cx="992" cy="162" r="67" fill="#151B39" stroke="#8F80FF" opacity=".97" stroke-width="2"/>
    <path d="M974 137 L950 162 L974 187 M1010 137 L1034 162 L1010 187" fill="none" stroke="url(#beam)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1001 124 L983 201" stroke="#F4F0FF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="911" cy="81" r="5" fill="#25D6ED"/>
    <circle cx="1095" cy="209" r="5" fill="#9176FF"/>
    <path d="M774 76 H840 M840 76 L860 96 H889" stroke="#6F74B5" stroke-opacity=".5" fill="none" stroke-width="2"/>
    <path d="M1090 100 H1140 V78" stroke="#6F74B5" stroke-opacity=".5" fill="none" stroke-width="2"/>
