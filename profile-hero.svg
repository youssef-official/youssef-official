    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="950" cy="159" r="275" fill="url(#glow)"/>
    <circle cx="1080" cy="315" r="125" fill="#00D4F2" opacity=".08" filter="url(#blur)"/>
    <path d="M0 0 H1200" stroke="url(#beam)" stroke-width="5"/>
    <path d="M28 306 H1172" stroke="#9A8FFF" stroke-opacity=".22"/>
    <rect x="58" y="46" width="178" height="31" rx="15.5" fill="#1C2242" stroke="#7771CC" stroke-opacity=".42"/>
