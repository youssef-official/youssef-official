<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Youssef Elsayed — Software Engineer</title>
  <desc id="desc">Dark indigo developer profile header with violet and cyan highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1B"/>
      <stop offset=".52" stop-color="#11152B"/>
      <stop offset="1" stop-color="#1A1640"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7661FE"/>
      <stop offset="1" stop-color="#25D6ED"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8059FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8059FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#A7B9ED" stroke-width=".8" opacity=".09"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <g clip-path="url(#clip)">
